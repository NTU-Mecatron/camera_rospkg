/**/camera_publisher:
  ros__parameters:
    device:          "/dev/video0"              # /dev/videoX, index, or video file path
    frame_id:        "camera_optical_frame"
    calibration_url: "src/perception/camera_rospkg/config/calibration.yaml"
    width:           640
    height:          480
    fps:             30.0
    rectify:         true                       # apply undistort/remap using calibration
