/**/camera_publisher:
  ros__parameters:
    device:          "/dev/video0"              # /dev/videoX, index, or video file path
    frame_id:        "camera_optical_frame"
    calibration_url: "src/perception/camera_rospkg/config/calibration.yaml"
    width:           640
    height:          480
    fps:             30.0
    rectify:         true                       # apply undistort/remap using calibration
    output_width:    0                          # >0: downscale to this size before publishing (0 = off)
    output_height:   0
    # Camera controls (optional, raw driver values; see README). Left out = camera's own setting.
    # white_balance_automatic: 1        # 0/1; set 0 for white_balance_temperature to take effect
    # white_balance_temperature: 4500   # 2300..6500
    # auto_exposure: 0                  # menu: 0 = auto, 1 = manual; set 1 for exposure_time_absolute to take effect
    # exposure_time_absolute: 5         # 5..660
    # gain: 168                         # 168..1600 (default is the minimum)
    # brightness: 0                     # -64..64
    # contrast: 10                      # 0..20
    # saturation: 10 
